{{ define "changepassword" }}
{{ template "header" . }}
{{ template "navbar" . }}
<section class="auth-card surface-card">
  <div class="page-heading"><h1>{{ GetLangText "Change password" .Lang }}</h1></div>
  <form action="/changepassword" method="post" class="vstack gap-3">
    <input type="hidden" name="_CSRF" value="{{ .Csrf }}">
    {{ if .Token }}<input type="hidden" name="_token" value="{{ .Token }}">{{ end }}
    <div><label class="form-label" for="password">{{ GetLangText "Password" .Lang }}</label><input type="password" class="form-control" id="password" name="password" minlength="10" maxlength="72" required autocomplete="new-password"></div>
    <div><label class="form-label" for="repeatpassword">{{ GetLangText "Repeat password" .Lang }}</label><input type="password" class="form-control" id="repeatpassword" name="repeatpassword" minlength="10" maxlength="72" required autocomplete="new-password"></div>
    <button type="submit" class="btn btn-primary">{{ GetLangText "Save" .Lang }}</button>
  </form>
</section>
{{ template "footer" . }}
{{ end }}
