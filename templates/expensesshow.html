{{ define "expensesshow" }}
{{ template "header" . }}
{{ template "navbar" . }}
<section class="form-card surface-card">
  <div class="page-heading"><h1>{{ GetLangText "Update expense" .Lang }}</h1></div>
  {{ with .Expenses }}{{ range . }}{{ $eid := .ExpensesPid }}
  <form action="/expenses/update" method="post">
    <input type="hidden" name="_CSRF" value="{{ $.Csrf }}"><input type="hidden" name="id" value="{{ .Pid }}">
    <div class="row g-3">
      <div class="col-12 col-md-6"><label class="form-label" for="description">{{ GetLangText "Description" $.Lang }}</label><input type="text" class="form-control" id="description" name="description" value="{{ .Description }}" required></div>
      <div class="col-12 col-md-6"><label class="form-label" for="expense_id">{{ GetLangText "Expense type" $.Lang }}</label><select id="expense_id" name="expense_id" class="form-select">{{ with $.ExpensesAdd }}{{ range . }}<option value="{{ .Pid }}" {{ if eq .Pid $eid }}selected{{ end }}>{{ .Description }}</option>{{ end }}{{ end }}</select></div>
      <div class="col-6"><label class="form-label" for="amount">{{ GetLangText "Amount" $.Lang }} RSD</label><input type="number" min="0" step="any" class="form-control" id="amount" name="amount" value="{{ .Amount }}"></div>
      <div class="col-6"><label class="form-label" for="amounte">{{ GetLangText "Amount" $.Lang }} EUR</label><input type="number" min="0" step="any" class="form-control" id="amounte" name="amounte"></div>
      <div class="col-12 d-flex gap-2"><button type="submit" class="btn btn-primary">{{ GetLangText "Save" $.Lang }}</button><a class="btn btn-outline-secondary" href="/expenses">{{ GetLangText "Cancel" $.Lang }}</a></div>
    </div>
  </form>
  {{ end }}{{ end }}
</section>
{{ template "footer" . }}
{{ end }}
