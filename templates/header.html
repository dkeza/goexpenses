{{ define "header" }}
<!doctype html>
<html lang="{{ if eq .Lang "DE" }}de{{ else if eq .Lang "RS" }}sr-Latn{{ else if eq .Lang "SR" }}sr-Cyrl{{ else }}en{{ end }}" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <title>{{ GetLangText "Expenses App" .Lang }}</title>
  <script nonce="{{ .CSPNonce }}">
    (() => {
      let savedTheme = null;
      try { savedTheme = localStorage.getItem('theme'); } catch (_) {}
      const theme = savedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-bs-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="/static/css/bootstrap.min.css?v={{ AssetVersion }}">
  <link rel="stylesheet" href="/static/css/main.css?v={{ AssetVersion }}">
  <!-- Links are fetched on hover so the next page opens at once. Links that change state are skipped. -->
  <script type="speculationrules" nonce="{{ .CSPNonce }}">
    {
      "prefetch": [{
        "where": {
          "and": [
            { "href_matches": "/*" },
            { "not": { "href_matches": "/static/*" } },
            { "not": { "href_matches": "/logout" } },
            { "not": { "href_matches": "/verify-email*" } },
            { "not": { "href_matches": "/resetpassword*" } },
            { "not": { "href_matches": "/*\\?*(^|&)lang=*" } },
            { "not": { "href_matches": "/*\\?*(^|&)reset=*" } }
          ]
        },
        "eagerness": "moderate"
      }]
    }
  </script>
  {{ if and (ne .Active "admin") (not .HideThirdPartyScripts) }}
    <script nonce="{{ .CSPNonce }}" async src="https://www.googletagmanager.com/gtag/js?id=G-KKB8YLYF3E"></script>
    <script nonce="{{ .CSPNonce }}">
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-KKB8YLYF3E');
    </script>
    <script nonce="{{ .CSPNonce }}" async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5252994111098678" crossorigin="anonymous"></script>
  {{ end }}
</head>
<body>
{{ end }}
