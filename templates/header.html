{{ define "header" }}
<!doctype html>
<html lang="{{ if eq .Lang "DE" }}de{{ else if eq .Lang "RS" }}sr-Latn{{ else if eq .Lang "SR" }}sr-Cyrl{{ else }}en{{ end }}" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{ GetLangText "Expenses App" .Lang }}</title>
  <script>
    (() => {
      let savedTheme = null;
      try { savedTheme = localStorage.getItem('theme'); } catch (_) {}
      const theme = savedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-bs-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="/static/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/main.css">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-KKB8YLYF3E"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-KKB8YLYF3E');
  </script>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5252994111098678" crossorigin="anonymous"></script>
</head>
<body>
{{ end }}
