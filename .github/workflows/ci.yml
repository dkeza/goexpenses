name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Go tests and ARM build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build Raspberry Pi binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm
          GOARM: "7"
        run: |
          mkdir -p dist
          go build -trimpath -o dist/goexpenses .

      - name: Upload Raspberry Pi binary
        uses: actions/upload-artifact@v7
        with:
          name: goexpenses-linux-armv7
          path: dist/goexpenses
          retention-days: 7
