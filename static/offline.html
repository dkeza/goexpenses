<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Expenses App</title>
  <style>
    :root { color-scheme: light dark; --bg: #f5f7fb; --text: #0f172a; --muted: #64748b; --primary: #4f46e5; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f172a; --text: #e2e8f0; --muted: #94a3b8; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem; box-sizing: border-box;
      background: var(--bg); color: var(--text); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
    img { width: 4rem; height: 4rem; }
    h1 { font-size: 1.35rem; margin: 1rem 0 0.5rem; }
    p { margin: 0.25rem 0; color: var(--muted); }
    a { display: inline-block; margin-top: 1.5rem; padding: 0.6rem 1.4rem; border-radius: 0.6rem;
      background: var(--primary); color: #fff; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <img src="/static/icons/icon-192.png" alt="">
    <h1>You are offline</h1>
    <p lang="de">Sie sind offline</p>
    <p lang="sr-Latn">Niste povezani na internet</p>
    <p lang="sr-Cyrl">Нисте повезани на интернет</p>
    <a href="/">Try again · Erneut versuchen · Pokušaj ponovo</a>
  </main>
</body>
</html>
